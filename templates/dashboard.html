<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <a href="/vehicle_reg" class="btn btn-success">Vehicle Registration</a>
    <a href="/vehicle_list" class="btn btn-secondary">View Vehicles</a>
    <a href="/feedback" class="btn btn-info">Feedback</a>
    <a href="/complaint" class="btn btn-warning">Complaint</a>
    <a href="/logout" class="btn btn-danger">Logout</a>

</head>

<div class="text-end mb-3">
    <h5 id="datetime"></h5>
</div>

<script>
function updateTime() {
    const now = new Date();
    document.getElementById("datetime").innerHTML =
        now.toLocaleString();
}
setInterval(updateTime, 1000);
</script>

<body style="background:#f4f6f9;">

<div class="container mt-4">

    <h2 class="mb-4 text-center">E-RTO Dashboard</h2>

    <!-- Cards -->
    <div class="row text-center">

        <div class="col-md-3">
            <div class="ID bg-primary text-white p-3 shadow">
                <h5>Total</h5>
                <h2>{{total}}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="ID bg-warning p-3 shadow">
                <h5>Pending</h5>
                <h2>{{pending}}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="ID bg-success text-white p-3 shadow">
                <h5>Approved</h5>
                <h2>{{approved}}</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="ID bg-danger text-white p-3 shadow">
                <h5>Rejected</h5>
                <h2>{{rejected}}</h2>
            </div>
        </div>

    </div>

    <!-- Chart -->
    <div class="card mt-5 p-4 shadow">
        <h4 class="text-center">Application Analytics</h4>
        <canvas id="myChart"></canvas>
    </div>

    <!-- Buttons -->
    <div class="text-center mt-4">
        <a href="/apply_dl" class="btn btn-primary">Apply DL</a>
        <a href="/status" class="btn btn-info">Status</a>
        <a href="/admin_login" class="btn btn-dark">Admin Login</a>
    </div>

</div>

<script>
var ctx = document.getElementById('myChart');

new Chart(ctx, {
    type: 'doughnut',
    data: {
        labels: ['Pending', 'Approved', 'Rejected'],
        datasets: [{
            data: [{{pending}}, {{approved}}, {{rejected}}],
            backgroundColor: ['#ffc107', '#28a745', '#dc3545']
        }]
    }
});
</script>

<!-- Chart Canvas -->
<canvas id="myChart"></canvas>

<!-- Chart.js CDN (VERY IMPORTANT) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- 🔥 YOUR SCRIPT HERE -->
<script>
var ctx = document.getElementById('myChart');

var chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
        labels: ['Pending', 'Approved', 'Rejected'],
        datasets: [{
            data: [{{pending}}, {{approved}}, {{rejected}}],
            backgroundColor: ['#ffc107', '#28a745', '#dc3545']
        }]
    }
});

// AUTO UPDATE
function updateDashboard() {
    fetch('/dashboard_data')
    .then(response => response.json())
    .then(data => {

        document.getElementById('total').innerText = data.total;
        document.getElementById('pending').innerText = data.pending;
        document.getElementById('approved').innerText = data.approved;
        document.getElementById('rejected').innerText = data.rejected;

        chart.data.datasets[0].data = [
            data.pending,
            data.approved,
            data.rejected
        ];
        chart.update();
    });
}

setInterval(updateDashboard, 5000);
</script>
<div id="chatbox" style="
position:fixed;
bottom:20px;
right:20px;
width:320px;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
border-radius:15px;
padding:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
">

    <h4 style="text-align:center;">💬 Help Chat</h4>

    <div id="messages" style="
        height:200px;
        overflow-y:auto;
        background:white;
        color:black;
        border-radius:10px;
        padding:5px;
        margin-bottom:10px;
    "></div>

    <input type="text" id="userInput" placeholder="Type message..." 
    style="width:70%; padding:5px; border-radius:5px; border:none;">

    <button onclick="sendMessage()" 
    style="padding:5px 10px; border:none; border-radius:5px; background:#28a745; color:white;">
    Send
    </button>

</div>

<script>
function sendMessage() {
    let input = document.getElementById("userInput");
    let msg = input.value;

    if (msg.trim() === "") return;

    let messages = document.getElementById("messages");

    // Show user message
    messages.innerHTML += "<p><b>You:</b> " + msg + "</p>";

    fetch('/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: msg })
    })
    .then(response => response.json())
    .then(data => {
        messages.innerHTML += "<p><b>Bot:</b> " + data.reply + "</p>";
        messages.scrollTop = messages.scrollHeight;
    })
    .catch(error => {
        messages.innerHTML += "<p style='color:red;'>Error connecting to server</p>";
        console.error(error);
    });

    input.value = "";
}
</script>
</body>
</html>
