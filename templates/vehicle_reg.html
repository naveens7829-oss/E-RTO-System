<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <h2>Vehicle Registration</h2>

    <form method="post">
        <input class="form-control mb-3" name="vehicle_no" placeholder="Format: KA 01 AB 1234">
        <input class="form-control mb-3" name="owner" placeholder="Owner Name">
        <input class="form-control mb-3" name="model" placeholder="Vehicle Model">

        <button class="btn btn-success">Register Vehicle</button>
    </form>
</div>
