<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <h2>Registered Vehicles</h2>

    <table class="table table-bordered text-center">
        <tr>
            <th>ID</th>
            <th>Owner</th>
            <th>Vehicle No</th>
            <th>Model</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for v in data %}
        <tr>
            <td>{{v[0]}}</td>
            <td>{{v[1]}}</td>
            <td>{{v[2]}}</td>
            <td>{{v[3]}}</td>
            <td>{{v[4]}}</td>
            <td>
                {% if session.get('admin') %}
    <a href="/vehicle_update/{{v[0]}}/Approved" class="btn btn-success btn-sm">Approve</a>
    <a href="/vehicle_update/{{v[0]}}/Rejected" class="btn btn-danger btn-sm">Reject</a>
    <a href="/vehicle_update/{{v[0]}}/Approved">Approve</a>
     <a href="/vehicle_update/{{v[0]}}/Rejected">Reject</a>
{% else %}
    <span class="text-muted">Admin Only</span>
{% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
