<!DOCTYPE html>
<html>
<head>
    <title>Apply DL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:#f5f7fa; color:black;">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4 text-dark">Apply Driving License</h2>

        <form method="post" enctype="multipart/form-data">

            <label class="form-label text-dark">Name</label>
            <input type="text" class="form-control mb-3" name="name" placeholder="Enter your name" style="color:black;">

            <label class="form-label text-dark">Age</label>
            <input type="number" class="form-control mb-3" name="age" placeholder="Enter your age" style="color:black;">

            <label class="form-label text-dark">Upload Document</label>
            <input type="file" class="form-control mb-3" name="doc">

            <button class="btn btn-primary w-100">Submit Application</button>

        </form>
    </div>
</div>

</body>
</html>
