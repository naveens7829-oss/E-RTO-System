<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <h2>Admin Panel</h2>
    <a href="/admin_login">Admin Login</a>

    <table class="table table-bordered mt-4">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{row[0]}}</td>
            <td>{{row[1]}}</td>
            <td>{{row[2]}}</td>
            <td>{{row[4]}}</td>
            <td>
                <a class="btn btn-success btn-sm" href="/update/{{row[0]}}/Approved">Approve</a>
                <a class="btn btn-danger btn-sm" href="/update/{{row[0]}}/Rejected">Reject</a>
            </td>
        </tr>
        {% endfor %}

    </table>
</div>
