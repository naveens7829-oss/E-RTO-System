<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="text-center mb-4">User Registration</h2>

        <form method="post">

            <label class="form-label">Full Name</label>
            <input class="form-control mb-3" name="name" placeholder="Enter your full name">

            <label class="form-label">Username</label>
            <input class="form-control mb-3" name="username" placeholder="Choose username">

            <label class="form-label">Password</label>
            <input type="password" class="form-control mb-3" name="password" placeholder="Enter password">

            <button class="btn btn-success w-100">Register</button>

        </form>
    </div>
</div>
