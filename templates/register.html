<!DOCTYPE html>
<html>
<head>
<title>Register - E-RTO</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
}

/* MAIN CONTAINER */
.container {
    display: flex;
    height: 100vh;
}

/* LEFT SIDE (IMAGE / INFO) */
.left {
    <img src="/static/car.png" width="300" alt="A modern car driving on a scenic highway, surrounded by lush greenery and clear skies, conveying a sense of reliability and convenience for online RTO vehicle services.">
    width: 50%;
    color: white;
    padding: 50px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.left h1 {
    font-size: 40px;
}

.left p {
    font-size: 18px;
}

/* RIGHT SIDE (FORM) */
.right {
    width: 50%;
    background: white;
    padding: 40px;
    border-radius: 20px 0 0 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* BUTTON */
button {
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2a5298;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #1e3c72;
}

/* OTP BUTTON */
.otp-btn {
    background: orange;
}

.otp-btn:hover {
    background: darkorange;
}

/* TITLE */
h2 {
    text-align: center;
}
</style>

</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <h1>🚗 Welcome to E-RTO Service</h1>
        <p>
            Apply for Driving License, Register Vehicles,  
            and manage all RTO services easily online.
        </p>

        <br>

        <p>
            ✔ Fast & Secure Registration  
            ✔ Digital Vehicle Services  
            ✔ Government Approved System  
        </p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <h2>Create Account</h2>

        <form method="POST">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <input type="text" id="mobile" name="mobile" placeholder="Mobile Number" required>

            <button type="button" class="otp-btn" onclick="sendOTP()">Send OTP</button>

            <input type="text" name="otp" placeholder="Enter OTP" required>

            <button type="submit">Register</button>

        </form>

    </div>

</div>

<script>
function sendOTP() {
    let mobile = document.getElementById("mobile").value;

    fetch('/send_otp', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'mobile=' + mobile
    })
    .then(res => res.text())
    .then(data => alert(data));
}
</script>

</body>
</html>
